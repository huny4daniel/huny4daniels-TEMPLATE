# PR과 main push마다 설치 → 린트 → 테스트 → 빌드.
# 스택이 정해지면 아래 step의 명령을 채우고, 해당하지 않는 step은 지운다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Python (uv) 예시 ---
      # - uses: astral-sh/setup-uv@v6
      # - run: uv sync --all-packages
      # - run: uv run ruff check .
      # - run: uv run pytest

      # --- Node (pnpm) 예시 ---
      # - uses: pnpm/action-setup@v4
      # - uses: actions/setup-node@v4
      #   with: { node-version: 22, cache: pnpm }
      # - run: pnpm install --frozen-lockfile
      # - run: pnpm turbo run lint typecheck test build

      # --- Android (Gradle) 예시 ---
      # - uses: actions/setup-java@v4
      #   with: { distribution: temurin, java-version: 21 }
      # - run: ./gradlew test assembleDebug
      #   working-directory: apps/android

      - name: Placeholder
        run: echo "CI 명령을 채우세요"

      # spec 커버리지: Done 기능의 시나리오마다 테스트가 있는지 (checks.env의 SPEC_TEST_GLOB가 비어 있으면 건너뜀)
      - name: spec 커버리지
        run: bash .claude/hooks/spec-coverage.sh

# 릴리즈 빌드는 태그(v*) 트리거의 release.yml을 별도로 둔다 (방식은 2단계 ADR에서 정한다 — .claude/process/02-design.md, 03-plan.md).
