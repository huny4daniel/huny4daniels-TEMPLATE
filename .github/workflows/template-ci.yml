# 템플릿 전용 CI (새 프로젝트로 복사되지 않음): 훅 스크립트 정적 검사와 회귀 테스트.
# 프로젝트용 CI는 ci.yml(프로젝트 소유 자리표시자)이다.
name: template-ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    # 템플릿에서 실수로 복사된 프로젝트에서는 돌지 않는다
    if: github.repository == 'huny4daniel/huny4daniels-TEMPLATE' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 줄바꿈 확인 (훅·테스트 파일은 LF)
        run: |
          if grep -lI $'\r' .claude/hooks/*.sh .claude/hooks/checks.env .github/hook-tests/*.bats .github/hook-tests/*.bash .github/hook-tests/*.tsv .github/hook-tests/fake-bin/* .githooks/*; then
            echo "CRLF가 들어간 파일이 있습니다 (.gitattributes 확인)"; exit 1
          fi

      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -x -S warning .claude/hooks/*.sh .githooks/* .github/hook-tests/fake-bin/gh

      - name: 생성 스크립트가 템플릿 전용 경로를 빼고 복사하는지
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'np'
          powershell -NoProfile -File tools/scripts/new-project.ps1 -Name P -Path $out | Out-Null
          $p = Join-Path $out 'P'
          $bad = Get-Content .template-only | Where-Object { $_ -and -not $_.StartsWith('#') } | Where-Object { Test-Path (Join-Path $p $_.TrimEnd('/')) }
          if ($bad) { Write-Error "복사되면 안 되는 경로: $bad"; exit 1 }
          foreach ($need in 'docs/SPEC.md', '.claude/process/PROCESS.md', '.githooks/pre-push') { if (-not (Test-Path (Join-Path $p $need))) { Write-Error "빠진 경로: $need"; exit 1 } }

      - name: bats 설치
        run: git clone --quiet --depth 1 --branch v1.11.1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"

      - name: 훅 회귀 테스트
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
          "$RUNNER_TEMP/bats-core/bin/bats" --print-output-on-failure .github/hook-tests
